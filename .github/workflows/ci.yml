name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR cancels the first run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pinned to match .fvmrc. Bump both together, never just one —
      # a version split between the two machines is the top cause of
      # "passes locally, fails in CI".
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runs on Linux, so it is the single source of truth on formatting —
      # neither machine's editor gets to win the argument.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter=expanded
